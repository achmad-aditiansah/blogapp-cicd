name: Periodic Health

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2  * * 1'

jobs:
  health_check:
    runs-on: ubuntu-latest
    steps:
      - name: Check deployed service url
        uses: jtalk/url-health-check-action@v5
        with:
          url: https://blogapp-cicd-mwzc.onrender.com|https://blogapp-cicd-mwzc.onrender.com/health
          max-attempts: 3
          retry-delay: 5s