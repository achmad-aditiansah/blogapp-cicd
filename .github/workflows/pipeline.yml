name: Deployment pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches: [main]
    types: [opened, synchronize]

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-node@v6
      with:
        node-version: '24'
    - name: Install monorepo dependencies
      run: |
        npm run install:all
        npm install --prefix e2e-tests
    - name: Lint backend
      run: npm run lint:server
    - name: Lint frontend
      run: npm run lint:client
    - name: Run backend test
      run: npm run test:server
      env:
        TEST_MONGODB_URI: ${{ secrets.TEST_MONGODB_URI }}
        MONGODB_URI: ${{ secrets.TEST_MONGODB_URI }}
        SECRET: ${{ secrets.JWT_SECRET }}
        PORT: 3003
    - name: Run frontend test
      run: npm run test:client
    - name: Build frontend client
      run: npm run build:client  
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps --prefix e2e-tests
    - name: Run e2e test
      run: npm run test:e2e
      env:
        TEST_MONGODB_URI: ${{ secrets.TEST_MONGODB_URI }}
        MONGODB_URI: ${{ secrets.TEST_MONGODB_URI }}
        SECRET: ${{ secrets.JWT_SECRET }}
        PORT: 3003
  
  deploy:
    needs: [build_and_test]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-node@v6
      with:
        node-version: '24'
    - name: Trigger deployment
      if: ${{ github.event_name == 'push' && !contains(join(github.event.commits.*.message, ' '), '#skip') }}
      run: curl ${{ secrets.RENDER_DEPLOY_HOOK }}

  notify_success:
    needs: [deploy]
    runs-on: ubuntu-latest
    steps:
    - name: Success Notification
      if: ${{ github.event_name == 'push' && !contains(join(github.event.commits.*.message, ' '), '#skip') }}
      uses: sarisia/actions-status-discord@v1
      with:
        webhook: ${{ secrets.DISCORD_WEBHOOK }}
        status: success
        content: "✅ **Deployment Successful!** A new version deployed to production"
        title: "Deployment Details"
        url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        noprefix: true
        nodetail: true
        description: |
          **Commit:** ${{ github.event.head_commit.id }}
          **Message:** ${{ github.event.head_commit.message }}
          **Author:** ${{ github.event.head_commit.author.name }}

  tag_release:
    needs: [deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: '0'
    - name: Bump version and push tag
      if: ${{ github.event_name == 'push' && !contains(join(github.event.commits.*.message, ' '), '#skip') }}
      uses: anothrNick/github-tag-action@4ed44965e0db8dab2b466a16da04aec3cc312fd8
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        DEFAULT_BUMP: patch

  notify_failure:
    needs: [build_and_test, deploy]
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    steps:
    - name: Failure Notification
      uses: sarisia/actions-status-discord@v1
      with: 
        webhook: ${{ secrets.DISCORD_WEBHOOK }}
        status: failure
        content: "❌ **Build Failed!** The pipeline encountered an error"
        title: "Failure Details"
        noprefix: true
        nodetail: true
        description: |
          **Repository:** ${{ github.repository }}
          **Branch:** ${{ github.head_ref || github.ref_name }}
          **Commit:** ${{ github.event.head_commit.id || github.event.pull_request.head.sha }}
          **Message:** ${{ github.event.head_commit.message || github.event.pull_request.title }}
          **Author:** ${{ github.event.head_commit.author.name || github.event.pull_request.user.login }}
          **Workflow:** ${{ github.workflow }}
          **Job:** ${{ needs.build_and_test.result == 'failure' && 'build_and_test' || 'deploy' }}

          [View Commit](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.event.head_commit.id || github.event.pull_request.head.sha }})
          [View Workflow Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})